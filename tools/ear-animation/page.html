<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening — ear motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#021416; --signal:#6ff5e6; --mist:#a9d9d4; --text:#e8fffb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#021416; } }
:root[data-theme="dark"]{ --ink:#021416; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;background:var(--ink);color:var(--mist);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{height:100%;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#gl{position:absolute;left:0;top:0;display:block;opacity:0;transition:opacity .8s ease}
#gl.on{opacity:1}
.status{position:absolute;left:0;right:0;bottom:max(30px,7vh);text-align:center;pointer-events:none;padding:0 20px}
.title{margin:0;font-size:clamp(17px,2.2vw,21px);font-weight:500;letter-spacing:-.02em;
  background:linear-gradient(100deg,rgba(232,255,251,.55) 20%,#fff 40%,var(--signal) 50%,rgba(232,255,251,.55) 62%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-130% 0}}
.sub{margin:8px 0 0;font-size:13.5px;letter-spacing:-.005em;color:rgba(169,217,212,.72);min-height:1.3em;transition:opacity .25s ease,transform .25s ease,color .4s ease}
.sub.out{opacity:0;transform:translateY(4px)}
.sub.saved{color:rgba(190,255,246,.95)}
.ctrl{position:absolute;top:16px;right:16px;display:flex;gap:8px}
.modes{display:flex;padding:3px;border-radius:999px;background:rgba(2,20,22,.4);border:1px solid rgba(111,245,230,.16)}
.modes button,.pp{appearance:none;border:0;background:transparent;color:rgba(169,217,212,.8);font:inherit;font-size:13px;font-weight:500;
  min-height:38px;padding:0 15px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
.modes button[aria-pressed="true"]{background:rgba(111,245,230,.14);color:var(--text)}
.pp{background:rgba(2,20,22,.4);border:1px solid rgba(111,245,230,.16)}
.modes button:focus-visible,.pp:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:rgba(169,217,212,.7);font-size:14px;transition:opacity .6s;pointer-events:none}
.credit{position:absolute;left:16px;bottom:10px;margin:0;font-size:10.5px;color:rgba(169,217,212,.38)}
.credit a{color:inherit}
@media (max-width:520px){ .ctrl{top:10px;right:10px} .modes button,.pp{padding:0 12px} .credit{left:12px;bottom:6px} }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" role="img" aria-label="A 3D ear listening: sound rings and a voice waveform flow into the ear canal, the ear lights up, and each phrase is saved as a glowing bead."></canvas>
  <div class="status" aria-live="polite">
    <p class="title" id="title">Listening</p>
    <p class="sub" id="sub">Capturing your voice</p>
  </div>
  <div class="ctrl">
    <div class="modes" role="group" aria-label="Input type">
      <button type="button" id="bVoice" aria-pressed="true">Voice</button>
      <button type="button" id="bType" aria-pressed="false">Typing</button>
    </div>
    <button type="button" class="pp" id="pp" aria-label="Pause animation">Pause</button>
  </div>
  <p class="msg" id="msg">Loading…</p>
  <p class="credit">Ear model: <a href="https://sketchfab.com/3d-models/human-ear-model-e1f0f4b6fae54d59bdc3c6b2534eb411" target="_blank" rel="noopener">“Human Ear Model” by ssavish274</a>, CC BY 4.0</p>
</div>
<script id="meshdata" type="application/octet-stream">@@MESH@@</script>

<script type="module">
@@SCENE@@
</script>
</body>
</html>

</body></html>
